name: release

# Push a tag v<version> matching <Version> in src/tws-login-win/tws-login-win.csproj. The release is created as a
# draft: check it, then publish it by hand.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    # Restores packages and runs tests: no write permissions here.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Tag matches the project version
        shell: pwsh
        run: |
          $version = ([xml](Get-Content src/tws-login-win/tws-login-win.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          if ("v$version" -ne $env:GITHUB_REF_NAME) { throw "tag $env:GITHUB_REF_NAME does not match version $version" }
      - run: ./build/publish.ps1
        shell: pwsh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            artifacts/tws-login-win.exe
            artifacts/SHA256SUMS
            CHANGELOG.md

  release:
    # Runs none of the project's code: only attests the built exe and drafts the release.
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create the release
      id-token: write      # sign the provenance attestation
      attestations: write  # store it
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
      - name: SHA256SUMS matches the exe
        run: sha256sum -c SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: tws-login-win.exe
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" tws-login-win.exe SHA256SUMS
          --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes-file CHANGELOG.md --draft --verify-tag
